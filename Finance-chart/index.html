<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>금융사 연표 차트</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button id="btnSide" class="icon only-narrow" data-i18n-title="지표 선택" title="지표 선택" data-i18n="☰ 지표">☰ 지표</button>
  <div class="brand"><span data-i18n="금융사 연표" style="color:inherit;font:inherit">금융사 연표</span> <span>1600 →</span></div>
  <div class="ranges" id="ranges"></div>
  <div class="zoom">
    <button id="zoomOut" data-i18n-title="축소" title="축소">−</button>
    <button id="zoomIn" data-i18n-title="확대" title="확대">+</button>
  </div>
  <div class="spacer"></div>
  <select id="lang" class="icon" title="Language"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option></select>
  <button id="btnKnow" class="icon" data-i18n="지식 노트">지식 노트</button>
  <button id="btnNotes" class="icon" data-i18n="메모 목록">메모 목록</button>
  <button id="btnTheme" class="icon" data-i18n-title="화면 색상 전환" title="화면 색상 전환" data-i18n="테마">테마</button>
  <button id="btnAuth" class="icon primary" data-i18n="로그인">로그인</button>
</header>

<div id="app">
  <aside id="side">
    <div class="side-h">
      <input id="search" type="search" data-i18n-ph="지표 검색" placeholder="지표 검색">
    </div>
    <div id="series-list"></div>
    <div class="side-foot">
      <div data-i18n="출처가 다른 자료를 이어 붙이지 않고 지표별로 따로 보여줍니다. 각 지표의 ⓘ 에서 출처를 확인하세요.">출처가 다른 자료를 이어 붙이지 않고 지표별로 따로 보여줍니다. 각 지표의 ⓘ 에서 출처를 확인하세요.</div>
      <div id="gen"></div>
    </div>
  </aside>

  <main id="main">
    <div id="chips"></div>
    <div id="notice"></div>
    <div id="chartwrap">
      <canvas id="cv"></canvas>
      <div id="tip"></div>
      <div id="pop"></div>
      <div id="empty"></div>
    </div>
    <div id="bar">
      <label class="chk"><input type="checkbox" id="optRebase"> <span data-i18n="시작=100 비교">시작=100 비교</span></label>
      <label class="chk"><input type="checkbox" id="optLog"> <span data-i18n="로그 눈금">로그 눈금</span></label>
      <label class="chk"><input type="checkbox" id="optEvents" checked> <span data-i18n="역사 사건">역사 사건</span></label>
      <label class="sel"><span data-i18n="메모 표시">메모 표시</span>
        <select id="optNotes">
          <option value="own" data-i18n="메모별 설정">메모별 설정</option>
          <option value="dot" data-i18n="모두 점으로">모두 점으로</option>
          <option value="label" data-i18n="모두 글씨로">모두 글씨로</option>
        </select>
      </label>
      <span class="hint" data-i18n="휠: 확대/축소 · 드래그: 이동 · 클릭: 메모 추가">휠: 확대/축소 · 드래그: 이동 · 클릭: 메모 추가</span>
    </div>
  </main>
</div>

<div id="modal" hidden></div>

<script src="i18n.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
